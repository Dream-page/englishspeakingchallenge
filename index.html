            { eng: "Plus, if something unexpected comes up, I won't have to stress about finishing my work on time.", kor: "또 예상치 못한 뭔가가 생겼을 때, 제시간에 마무리 해야 한다는 생각에 전전긍긍하면서 스트레스 받지 않아도 돼." },
            { eng: "Also, I don't perform well under such high pressure.", kor: "그리고 일단 내가 그런 압박이 있으면 성과가 잘 안 나기도 해." },
            { eng: "I'm the opposite. I find that I work best under pressure.", kor: "나는 반대야. 나는 압박이 있어야 일을 잘 하더라고." },
            { eng: "When the deadline is looming, I suddenly become super focused and efficient.", kor: "데드라인이 다가올 때 갑자기 미친듯이 집중이 되고 효율이 올라가더라니까." },
            { eng: "And when I finally nail it right before the deadline, I feel this huge sense of catharsis.", kor: "그리고 데드라인 직전에 딱 끝내잖아? 이 카타르시스가 확 느껴진단 말이지." },
            { eng: "I know it's not the best habit to have.", kor: "이 습관이 물론 좋은 습관은 아니란 걸 알아." },
            { eng: "But I've been doing it for so long that I'm kind of addicted to this rush.", kor: "근데 너무 오랫동안 해와서 이렇게 빨리 해내는 거에 약간 중독이 된 듯.." },
            ],
            48: [
            { eng: "I really want to get married and start a family someday.", kor: "나는 결혼을 해서 가정을 언젠가 꼭 꾸리고 싶어." },
            { eng: "Like, it's so important to have that one person who's always there for me, no matter what.", kor: "무슨 일이 있든지 내 편이 되어주는 한 명이 있는 게 난 진짜 중요한 것 같아." },
            { eng: "I guess I learned it from my parents. They just seem incredibly happy together.", kor: "우리 부모님한테서 느낀 것 같기도 해. 두 분이 같이 있을 때 너무 행복해보이거든." },
            { eng: "And honestly I think the media is always pushing this idea of staying single.", kor: "그리고 솔직히 미디어에서 혼자 살도록 좀 부추기는 것 같아." },
            { eng: "They only show us the bad parts of marriage but it can be really amazing if you find the right person.", kor: "결혼의 안 좋은 면만 보여주는데.. 제대로 된 사람만 찾으면 진짜 좋지 않을까?" },
            { eng: "I don't think getting married is important to be happy in life.", kor: "나는 인생의 행복에 있어 결혼은 별로 중요하지 않다고 생각해." },
            { eng: "I see many successful single people around me who are living fulfilling lives without marriage.", kor: "나는 결혼 안 하고도 충분히 만족스러운 삶을 사는, 성공한 싱글들이 주변에 많단 말이지." },
            { eng: "Besides, I'm more focused on my career right now.", kor: "그리고 나는 지금 커리어 쌓는 게 더 중요해." },
            { eng: "And marriage can be a trap that limits my growth.", kor: "결혼은 오히려 내 성장을 막는 트랩이 될 수도 있어." },
            { eng: "I also feel like the pressure to get married is outdated and doesn't apply to our generation.", kor: "또 결혼을 해야 한다는 압박을 갖는 게 되게 구시대적이라 생각하고 우리 세대랑은 맞지 않는 것 같아." },
            ],
            49: [
            { eng: "I've always thought that guys and girls can't truly be friends.", kor: "나는 남자랑 여자가 진짜로 찐친이 될 수는 없다고 생각하는 사람이야." },
            { eng: "They might say they're just friends, but it's highly likely that one of them is a friend in disguise.", kor: "뭐 자기들 말로는 그냥 친구라고 할 수 있지 근데 높은 확률로 한 명은 위장일 거야." },
            { eng: "Otherwise, why would so many couples get upset when their lover has a friend of the opposite sex?", kor: "안 그러면 왜 그렇게 많은 커플들이 상대가 친한 남사친/여사친 있으면 그렇게 화를 내겠어!" },
            { eng: "I mean, I've seen so many people start out as friends but eventually become a couple.", kor: "나는 처음에는 친구로 시작했다가 결국 커플이 된 사례를 너무 많이 봤거든." },
            { eng: "And let's face it, there are certain things you can't share with friends of the opposite gender.", kor: "그리고 솔직히 다른 성별 친구랑은 말 못하는 것들이 분명히 존재를 하잖아." },
            { eng: "Friendship doesn't depend on gender. They can be friends just fine.", kor: "우정은 성별이랑 상관 없어 남녀 사이 친구 당연히 될 수 있지." },
            { eng: "As long as both are mature enough to respect each other's boundaries.", kor: "둘 다 서로의 영역을 존중할 줄 아는 성숙한 사람이라면 말이야." },
            { eng: "I mean, the heck, I have many guy friends myself.", kor: "아니 뭐 나부터도 일단 남사친 많은데!" },
            { eng: "They are my good 'human network'.", kor: "다 나한테 좋은 인적 네트워크가 되잖아!" },
            { eng: "And not everything is shared with all of your friends, if you think of it. There are different types of friendships.", kor: "그리고 솔직히 생각해보면 동성친구랑도 모든걸 다 공유하지 않아. 그냥 우정도 다 다르게 생긴거지." },
            ],
            50: [
                { eng: "I love online shopping because it's so easy and convenient!", kor: "나는 온라인 쇼핑이 좋아 너무 쉽고 편하잖아~" },
                { eng: "I don't have to leave my house, walk around and see all the products just to find the thing that I like.", kor: "집을 나갈 필요도 없고 돌아다니면서 내가 좋아하는 거 찾기 위해 모든 상품을 볼 필요도 없고 말이야." },
                { eng: "Shopping online can save you so much time.", kor: "온라인으로 쇼핑하면 시간을 많이 절약할 수 있어." },
                { eng: "Oh, it saves your money too because it often has great deals that you can't find in stores.", kor: "가끔 오프라인 스토어에는 없는 좋은 할인들도 있기 때문에 돈도 절약이 되지." },
                { eng: "I also love the fact that I can read many reviews from other customers before I buy.", kor: "구매하기 전에 다른 사람들이 남긴 리뷰를 많이 읽어볼 수 있다는 것도 너무 좋아." },
                { eng: "I prefer to do my shopping in-person.", kor: "나는 직접 쇼핑을 하는 걸 더 선호해." },

                { eng: "I don't know how many times I got disappointed by the poor quality of the products from online shopping.", kor: "온라인 쇼핑으로 받은 물건들 질이 너무 떨어져서 실망한 적이 한 두번이 아니야." },
                { eng: "Also, I can shop with my friends and family and spend quality time with them.", kor: "그리고 친구들이나 가족들이랑 같이 쇼핑할 수 있어서 의미있는 좋은 시간을 보낼 수도 있지." },
                { eng: "And the best part is I can get it on the spot without waiting for several days.", kor: "가장 좋은 점은 며칠 기다릴 필요 없이 그 자리에서 바로 가져올 수 있다는 거야!" },
            ],
            51: [
            { eng: "I prefer wednesdays off cuz I feel like the week just flies by so quickly.", kor: "나는 수공강이 더 좋아 왜냐면 한 주가 엄청 빨리 지나가는 기분이거든." },
            { eng: "It's also like we have two weekends because we get to relax in the middle of the week.", kor: "또 일주일 중간에 쉬게 되니까 약간 주말이 두 번 있는 느낌이야" },
            { eng: "If I work hard for just two days, I can take a break and this goes on throughout the semester.", kor: "이틀 동안 열심히 일하면 한 번 쉴 수 있고 이게 한 학기 동안 반복되니까 ㅎㅎ" },
            { eng: "Also, it's less crowded on Wednesdays than on Fridays so I can relax better.", kor: "그리고 수요일이 금요일보다 사람이 덜 붐비니까 더 여유롭게 쉴 수 있어." },
            { eng: "What's more, during exam season, it's nice to be able to take a bit of a breather.", kor: "또 시험 기간에 약간의 숨통을 돌릴 수 있다는 게 얼마나 좋은지 몰라." },
            { eng: "Friday is the best day to unwind and let go of any stress from the week.", kor: "금요일이 한 주 동안 받은 스트레스를 풀고 쉬기에 가장 좋은 날이야." },

            { eng: "I start to feel happy from Thursday mornings knowing that I just need to get through one more day.", kor: "이제 하루만 더 지나면 된다는 생각 때문에 목요일 아침부터 행복하기 시작해." },
            { eng: "And it's a perfect day to hang out since many of my friends also have Fridays off.", kor: "그리고 내 친구들도 거의 다 금공강이라 같이 놀기에도 가장 좋은 날이야." },
            ],
            52: [
                { eng: "I think we don't need to study English as hard as before.", kor: "나는 예전처럼 열심히 영어 공부 할 필요 없다고 생각해." },

                { eng: "So instead of spending time memorizing grammar rules and vocabulary, we can focus on learning more important skills like coding or engineering.", kor: "그러니까 괜히 문법 규칙이나 단어 외우는 데에 시간을 쓰는 대신에, 코딩이나 엔지니어링같은 좀 더 중요한 기술들을 배우는 데 집중할 수 있는 거지." },

                { eng: "Plus, AI technology is not perfect yet and it still makes critical mistakes in translation.", kor: "그리고 인공지능기술이 아직 완벽한 건 아니고 번역할 때 아직도 치명적인 실수를 한단 말이지." },
                { eng: "But most importantly, I think relying too much on technology can be really risky.", kor: "하지만 가장 중요한 건 나는 기술에 너무 많이 의존하는 게 정말 위험할 것 같다 생각해." },
                { eng: "We gotta keep pushing ourselves to get better, otherwise we'll be replaced by the machine.", kor: "우리 스스로 더 발전하기 위해 계속 노력해야지 안 그러면 기계에 대체되게 생겼어!" },
            ],
            53: [
                { eng: "I always prefer studying at the library.", kor: "나는 항상 도서관에서 공부하는 걸 선호해." },
                { eng: "It's super quiet and everyone is focused.", kor: "완전 조용하고 사람들 다 집중하고 있잖아." },
                { eng: "When I see other people working hard like that, it makes me feel more motivated to study hard.", kor: "다른 사람들이 그렇게 열심히 하는 걸 보면 나도 더 공부 열심히 하도록 동기부여 받아" },
                { eng: "Plus, I don't have to worry about how I look or dress.", kor: "그리고 내가 어떻게 보이든 뭘 입든 이런거 신경 안 써도 되잖아." },
                { eng: "It's also a great way to get some quality studying without spending money on anything.", kor: "또 도서관 가는 게 그 어떤 것에도 돈 안 쓰고 질 높은 공부를 할 수 있는 좋은 방법인 것 같아." },
                { eng: "For me, cafe is a better place to study.", kor: "나 같은 경우는 카페가 공부하기에 더 나은 것 같아." },
                { eng: "The background noise of people chatting and the sound of coffee machines help me more focused.", kor: "사람들 말하는 소리나 커피 머신 소리 같은 잡음들이 날 더 잘 집중할 수 있게 도와줘" },
                { eng: "Also, I don't have to feel self-conscious about typing on my laptop.", kor: "그리고 내가 노트북으로 타자칠 때 다른 사람들 눈치 안 봐도 되잖아." },
                { eng: "And coffee keeps me going when I start to feel drained.", kor: "내가 좀 지치고 힘 빠질 때 커피 마시면 계속 할 수 있지." },
                { eng: "Sometimes I study with my friends and that helps me do better on exams.", kor: "가끔은 내 친구들이랑 공부 같이하는데 그게 시험을 더 잘 보도록 해주는 것 같아." },
            ],
            54: [
           [
        { eng: "I prefer working from home cuz then I don't have to commute in rush hour.", kor: "나는 재택 근무가 더 좋은데 그렇게 하면 사람 많은 시간대에 출퇴근 안해도 되잖아!" },

        { eng: "Since I'm not in the office, I don't have to deal with my boss constantly checking up on me.", kor: "사무실에 없으니까 내 상사가 계속 나 확인 하는 거에 스트레스 받지 않아도 되고!" },

        { eng: "I do feel more productive when I'm at the office.", kor: "그리고 사무실에 있을 때 더 생산적인 것 같이 느껴." },
        { eng: "Plus, it's easier to communicate with colleagues and boss in person than through zoom.", kor: "게다가 동료들이랑 상사랑 소통할 때도 줌으로 하는 것보다 직접하는 게 훨씬 쉽고." }

    // Day 55: 안전 투자 vs 위험 투자 (요청하신 링크 75번 기반, 필요시 사용하세요)
    55: [
        { eng: "I'm not really into taking big risks with money.", kor: "나는 내 돈 걸고 큰 위험을 감수하는 걸 좋아하지 않아." },
        { eng: "I'd rather play it safe and invest in things like fixed deposits.", kor: "차라리 좀 안전하게 하면서 정기 예금 같은 거에 투자할래." },
        { eng: "Besides, I saw one of my friends lost all of his money just overnight through crypto trading.", kor: "게다가 내 친구 한 명이 하룻밤 사이에 비트코인 거래하다가 돈 다 날렸거든." },
        { eng: "And I have more important things to do than check the stock prices 24/7.", kor: "그리고 하루 종일 주식 가격 확인할 시간이 없어." },
        { eng: "So I'll stick to investing in a savings account instead of risking my hard-earned money!", kor: "그러니 내가 힘들게 번 돈 갖고 위험하게 하느니 그냥 예금 계좌에 투자하는 걸 계속하려고." },
        { eng: "Yeah there's a chance that you could lose it all, but there's also a chance that you could make it big!", kor: "물론 번 돈을 다 날릴 가능성도 있지만, 번 돈을 더 크게 만들 가능성도 있지!" },
        { eng: "To make a lot of money while young, you gotta make bold moves and take risks.", kor: "젊을 때 더 많은 돈을 벌려면 더 대담한 행동을 하고 위험을 져야해." },
        { eng: "It's important to note that high returns come with high risks.", kor: "하이 리턴은 하이 리스크랑 같이 온다는 걸 기억하는 게 중요하지." },
        { eng: "Also, we should experience failure and learn from our mistakes to acheive financial freedom.", kor: "또 경제적 자유를 달성하려면 실패도 경험해보고 실수한 것에서 배우기도 해야해." },
        { eng: "And as long as we don't get too addicted to these investments, I think it's worth it.", kor: "그리고 너무 심하게 이런 류의 투자에 중독되지만 않는다면 나는 충분히 도전할 가치가 있다고 봐." }
    ],

    // Day 56: 패키지 여행 vs 자유 여행 (여기서부터 요청하신 수정 구간입니다)
    56: [

        { eng: "That way, you can upgrade your hobby and enjoy it even more.", kor: "그러면 취미도 더 업그레이드 시킬 수 있고 더 즐길 수 있을 거야." }

        const getEmptySentences = () => Array.from({ length: 10 }, () => ({ eng: "", kor: "" }));

        const StudyApp = () => {
            const [user, setUser] = useState(null);
            
            // 💡 수정된 부분: localStorage에서 저장된 아이디 불러오기
            const [syncId, setSyncId] = useState(() => localStorage.getItem('savedSyncId') || "");
            
            // --- Editing States for Inspo Notes ---
            const [editingNoteId, setEditingNoteId] = useState(null);
            const [editEng, setEditEng] = useState("");
            const [editKor, setEditKor] = useState("");

            const [showSyncModal, setShowSyncModal] = useState(false);

            const [currentDay, setCurrentDay] = useState(() => {
                const savedDay = localStorage.getItem('lastVisitedDay');
                return savedDay ? parseInt(savedDay) : 46;
            });
            const [isEditingDay, setIsEditingDay] = useState(false);
            const [tempDay, setTempDay] = useState(currentDay); 
            
            const [sentences, setSentences] = useState(getEmptySentences());
            const [notes, setNotes] = useState([]);
            const [completedDates, setCompletedDates] = useState([]);
            
            const [activeTab, setActiveTab] = useState('challenge'); 

            const [viewDate, setViewDate] = useState(new Date());

            const [timeLeft, setTimeLeft] = useState(3600);
            const [isActive, setIsActive] = useState(false);
            const [targetTime] = useState(3600);
            const [showCelebration, setShowCelebration] = useState(false);

            const [hideEnglish, setHideEnglish] = useState(false);
            const [revealedIndices, setRevealedIndices] = useState([]);
            const [newNoteEng, setNewNoteEng] = useState("");
            const [newNoteKor, setNewNoteKor] = useState("");

            const [repetitionCount, setRepetitionCount] = useState(0);

            // --- Pagination States ---
            const [notesPage, setNotesPage] = useState(1);
            const NOTES_PER_PAGE = 10;

            useEffect(() => {
                const initAuth = async () => {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }
                };
                initAuth();
                
                const unsubscribe = onAuthStateChanged(auth, (u) => {
                    if (u) {
                        setUser(u);
                        // 저장된 syncId가 없으면 내 uid를 기본값으로 사용하지만, 저장하진 않음
                        if (!syncId) setSyncId(u.uid); 
                    }
                });
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                setRevealedIndices([]);
                // setHideEnglish(false); // [수정] 스터디 모드 유지 (주석 처리)
            }, [activeTab, currentDay, notesPage]); 

            useEffect(() => {
                if (!user) return;
                
                const targetUserId = syncId || user.uid;
                const dayDocRef = doc(db, 'artifacts', appId, 'users', targetUserId, 'study_data', `day_${currentDay}`);

                const unsubscribe = onSnapshot(dayDocRef, (docSnap) => {
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        setSentences(data.sentences || getEmptySentences());
                        setRepetitionCount(data.repetitionCount || 0);
                    } else {
                        if (preloadedData[currentDay]) {
                            const initialData = preloadedData[currentDay];
                            setSentences(initialData);
                            setDoc(dayDocRef, { sentences: initialData, repetitionCount: 0 }, { merge: true });
                        } else {
                            setSentences(getEmptySentences());
                            setRepetitionCount(0);
                        }
                    }
                }, (error) => {
                    console.error("Error syncing day data:", error);
                    // 💡 권한 오류 자동 복구 로직
                    if (error.code === 'permission-denied') {
                        if (syncId && user && syncId !== user.uid) {
                            alert("동기화 ID가 만료되었거나 권한이 없습니다. 자동으로 내 ID로 초기화합니다.");
                            setSyncId(user.uid);
                            localStorage.removeItem('savedSyncId');
                        } else {
                            console.warn("내 데이터에 접근할 수 없습니다. 배포된 앱이라면 Firestore 보안 규칙을 확인해주세요.");
                        }
                    }
                });

                return () => unsubscribe();
            }, [user, currentDay, syncId]);

            useEffect(() => {
                if (!user) return;
                const targetUserId = syncId || user.uid;
                const globalDocRef = doc(db, 'artifacts', appId, 'users', targetUserId, 'study_data', 'global_data');

                const unsubscribe = onSnapshot(globalDocRef, (docSnap) => {
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        setNotes(data.notes || []);
                        setCompletedDates(data.completedDates || []);
                        if (data.timeLeft !== undefined) setTimeLeft(data.timeLeft);
                    }
                }, (error) => {
                    console.error("Error syncing global data:", error);
                    // 💡 권한 오류 자동 복구 로직 (글로벌 데이터)
                    if (error.code === 'permission-denied' && syncId && user && syncId !== user.uid) {
                        // 위에서 이미 alert을 띄웠을 수 있으므로 여기선 조용히 처리
                        setSyncId(user.uid);
                        localStorage.removeItem('savedSyncId');
                    }
                });

                return () => unsubscribe();
            }, [user, syncId]);

            const saveDayData = async (newSentences, newRepCount) => {
                if (!user) return;
                const targetUserId = syncId || user.uid;
                const dayDocRef = doc(db, 'artifacts', appId, 'users', targetUserId, 'study_data', `day_${currentDay}`);
                await setDoc(dayDocRef, { sentences: newSentences, repetitionCount: newRepCount }, { merge: true });
            };

            const saveGlobalData = async (newNotes, newDates, newTime) => {
                if (!user) return;
                const targetUserId = syncId || user.uid;
                const globalDocRef = doc(db, 'artifacts', appId, 'users', targetUserId, 'study_data', 'global_data');
                await setDoc(globalDocRef, { 
                    notes: newNotes !== undefined ? newNotes : notes, 
                    completedDates: newDates !== undefined ? newDates : completedDates,
                    timeLeft: newTime !== undefined ? newTime : timeLeft
                }, { merge: true });
            };

            useEffect(() => {
                let interval = null;
                if (isActive && timeLeft > 0) {
                    interval = setInterval(() => {
                        setTimeLeft((prev) => {
                            const newTime = prev - 1;
                            if (newTime % 10 === 0) saveGlobalData(undefined, undefined, newTime);
                            if (newTime <= 0) {
                                setIsActive(false);
                                handleGoalAchieved();
                                return 0;
                            }
                            return newTime;
                        });
                    }, 1000);
                } else if (timeLeft === 0) {
                    setIsActive(false);
                }
                return () => clearInterval(interval);
            }, [isActive, timeLeft]); 

            const handleGoalAchieved = () => {
                const d = new Date();
                const today = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
                
                if (!completedDates.includes(today)) {
                    const newDates = [...completedDates, today];
                    setCompletedDates(newDates);
                    saveGlobalData(undefined, newDates, 0);
                    setShowCelebration(true);
                    setTimeout(() => setShowCelebration(false), 5000);
                }
            };

            const updateSentence = (index, field, value) => {
                const newSentences = [...sentences];
                newSentences[index] = { ...newSentences[index], [field]: value };
                setSentences(newSentences);
                saveDayData(newSentences, repetitionCount);
            };

            const toggleHighlight = (index, isNote = false, noteId = null) => {
                if (isNote) {
                    const newNotes = notes.map(n => 
                        n.id === noteId ? { ...n, highlight: !n.highlight } : n
                    );
                    setNotes(newNotes);
                    saveGlobalData(newNotes, undefined, undefined);
                } else {
                    const newSentences = [...sentences];
                    newSentences[index] = { 
                        ...newSentences[index], 
                        highlight: !newSentences[index].highlight 
                    };
                    setSentences(newSentences);
                    saveDayData(newSentences, repetitionCount);
                }
            };

            const toggleRepetition = (index) => {
                let newCount = index + 1;
                if (repetitionCount === newCount) {
                    newCount = index; 
                }
                setRepetitionCount(newCount);
                saveDayData(sentences, newCount);
            };

            // 🗣️ TTS (Text-to-Speech) Function
            const speakText = (text) => {
                if (!text) return;
                // 현재 재생 중인 오디오가 있다면 중지
                window.speechSynthesis.cancel();

                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US'; // 미국식 영어
                utterance.rate = 1.0; // 보통 속도 (0.5 ~ 2.0)
                window.speechSynthesis.speak(utterance);
            };

            const addNote = () => {
                if (newNoteEng.trim()) {
                    const newNoteList = [{ 
                        id: Date.now(), 
                        eng: newNoteEng, 
                        kor: newNoteKor,
                        date: new Date().toLocaleDateString(),
                        highlight: false
                    }, ...notes];
                    setNotes(newNoteList);
                    saveGlobalData(newNoteList, undefined, undefined);
                    setNewNoteEng("");
                    setNewNoteKor("");
                    setNotesPage(1); // 새 노트 추가 시 1페이지로 이동
                }
            };

            const deleteNote = (id) => {
                const newNoteList = notes.filter(n => n.id !== id);
                setNotes(newNoteList);
                saveGlobalData(newNoteList, undefined, undefined);
            };

            // --- Edit Handlers for Inspo Notes ---
            const startEditing = (note) => {
                setEditingNoteId(note.id);
                setEditEng(note.eng);
                setEditKor(note.kor);
            };

            const cancelEdit = () => {
                setEditingNoteId(null);
                setEditEng("");
                setEditKor("");
            };

            const saveEdit = () => {
                const updatedNotes = notes.map(n => 
                    n.id === editingNoteId ? { ...n, eng: editEng, kor: editKor } : n
                );
                setNotes(updatedNotes);
                saveGlobalData(updatedNotes, undefined, undefined);
                setEditingNoteId(null);
            };

            const changeDay = (direction) => {
                const newDay = direction === 'next' ? currentDay + 1 : currentDay - 1;
                if (newDay > 0) {
                    setCurrentDay(newDay);
                    localStorage.setItem('lastVisitedDay', newDay); 
                }
            };

            const handleDaySubmit = () => {
                let d = parseInt(tempDay);
                if (isNaN(d) || d < 1) d = 1;
                setCurrentDay(d);
                localStorage.setItem('lastVisitedDay', d); 
                setIsEditingDay(false);
            };

            const handleSyncSave = () => {
                if (syncId) {
                    localStorage.setItem('savedSyncId', syncId); 
                }
                setShowSyncModal(false);
            };

            const formatTime = (seconds) => {
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;

                                                                                <Highlighter size={16} />
                                                                            </button>
                                                                            <button onClick={() => deleteNote(note.id)} className="text-slate-300 hover:text-red-400 transition-colors" title="삭제">
                                                                                <Trash2 size={16} />
                                                                            </button>
                                                                        </div>
                                                                    )}
                                                                </div>
                                                            </div>

                                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 ml-1">
                                                                {/* English Part */}
                                                                {editingNoteId === note.id ? (
                                                                     <div className="bg-slate-50 border border-purple-200 rounded-lg p-3 min-h-[80px] flex items-center">
                                                                        <textarea 
                                                                            value={editEng} 
                                                                            onChange={(e) => setEditEng(e.target.value)} 
                                                                            className="w-full h-full bg-transparent border-none text-slate-800 font-bold text-lg focus:ring-0 outline-none resize-none"
                                                                            rows={2}
                                                                        />
                                                                     </div>
                                                                ) : (
                                                                    <div 
                                                                        onClick={() => toggleReveal(idx + 1000)} // Offset index to avoid conflict
                                                                        className={`relative rounded-lg overflow-hidden transition-all duration-300 cursor-pointer min-h-[80px] flex items-center p-3
                                                                            ${hideEnglish && !revealedIndices.includes(idx + 1000) ? 'bg-slate-900' : (note.highlight ? 'bg-yellow-50' : 'bg-slate-50')}
                                                                        `}
                                                                    >
                                                                        <p className={`text-lg font-bold text-slate-800 w-full break-words ${hideEnglish && !revealedIndices.includes(idx + 1000) ? 'opacity-0' : 'opacity-100'}`}>
                                                                            {note.eng}
                                                                        </p>
                                                                        {hideEnglish && !revealedIndices.includes(idx + 1000) && (
                                                                            <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
                                                                                <span className="text-4xl">🙈</span>
                                                                            </div>
                                                                        )}
                                                                    </div>
                                                                )}

                                                                {/* Korean Part */}
                                                                {editingNoteId === note.id ? (
                                                                    <div className="bg-slate-50 border border-purple-200 rounded-lg p-3 min-h-[80px] flex items-center">
                                                                        <textarea 
                                                                            value={editKor} 
                                                                            onChange={(e) => setEditKor(e.target.value)} 
                                                                            className="w-full h-full bg-transparent border-none text-slate-700 text-base focus:ring-0 outline-none resize-none"
                                                                            rows={2}
                                                                        />
                                                                    </div>
                                                                ) : (
                                                                    <div className="bg-slate-50 rounded-lg p-3 min-h-[80px] flex items-center">
                                                                        <p className="text-base text-slate-700 w-full break-words font-medium">
                                                                            {note.kor}
                                                                        </p>
                                                                    </div>
                                                                )}
                                                            </div>
                                                        </div>
                                                    ))}
                                                    
                                                    {/* Pagination Controls */}
                                                    {notes.length > NOTES_PER_PAGE && (
                                                        <div className="flex justify-center items-center gap-4 mt-8">
                                                            <button 
                                                                onClick={() => paginate(Math.max(1, notesPage - 1))}
                                                                disabled={notesPage === 1}
                                                                className={`flex items-center gap-1 px-4 py-2 rounded-lg text-sm font-bold transition-colors ${notesPage === 1 ? 'text-slate-300 cursor-not-allowed' : 'text-[#BE123C] hover:bg-[#FFF1F2]'}`}
                                                            >
                                                                <ChevronLeft size={16} /> 이전
                                                            </button>
                                                            <span className="text-sm font-bold text-slate-600">
                                                                {notesPage} / {totalPages}
                                                            </span>
                                                            <button 
                                                                onClick={() => paginate(Math.min(totalPages, notesPage + 1))}
                                                                disabled={notesPage === totalPages}
                                                                className={`flex items-center gap-1 px-4 py-2 rounded-lg text-sm font-bold transition-colors ${notesPage === totalPages ? 'text-slate-300 cursor-not-allowed' : 'text-[#BE123C] hover:bg-[#FFF1F2]'}`}
                                                            >
                                                                다음 <ChevronRight size={16} />
                                                            </button>
                                                        </div>
                                                    )}
                                                </>
                                            )}
                                        </div>
                                    </>
                                )}
                                
                                <div className="mt-8 text-center text-xs text-slate-400">
                                    모든 내용은 온라인에 자동 저장됩니다. (동기화 ID를 사용하세요)
                                </div>

                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<StudyApp />);
    </script>
</body>
</html>
