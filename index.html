            54: [
            { eng: "We shouldn't have trusted him in the first place.", kor: "애초에 걔를 믿질 말았어야 했어.." },
            { eng: "Why did you agree to this in the first place if you didn't want to go?", kor: "아니 안 가고 싶었던 거면 애초에 왜 가겠다고 동의를 한거야?" },
            { eng: "From the first time we met, I knew we'd be friends.", kor: "우리 처음 만났을 때부터 난 우리가 친해질 줄 알았다구!" },
            { eng: "I loved this food from the first time I tried it.", kor: "처음 먹어봤을 때부터 이 음식 너무 좋았어!" },
            { eng: "At first, I thought it was a joke, but then I realized he was actually sick.", kor: "처음에는 장난치는 건 줄 알았는데 알고보니 진짜 아픈 거였더라." },
            { eng: "", kor: "" }, { eng: "", kor: "" }, { eng: "", kor: "" }, { eng: "", kor: "" }, { eng: "", kor: "" }
            ],
            55: Array.from({ length: 10 }, () => ({ eng: "", kor: "" })),
        };

        const getEmptySentences = () => Array.from({ length: 10 }, () => ({ eng: "", kor: "" }));

        const StudyApp = () => {
            const [user, setUser] = useState(null);
            const [syncId, setSyncId] = useState("");
            const [showSyncModal, setShowSyncModal] = useState(false);

            const [currentDay, setCurrentDay] = useState(46);
            const [isEditingDay, setIsEditingDay] = useState(false);
            const [tempDay, setTempDay] = useState(46);
            
            const [sentences, setSentences] = useState(getEmptySentences());
            const [notes, setNotes] = useState([]);
            const [completedDates, setCompletedDates] = useState([]);
            
            const [timeLeft, setTimeLeft] = useState(3600);
            const [isActive, setIsActive] = useState(false);
            const [targetTime] = useState(3600);
            const [showCelebration, setShowCelebration] = useState(false);

            const [hideEnglish, setHideEnglish] = useState(false);
            const [revealedIndices, setRevealedIndices] = useState([]);
            const [newNoteEng, setNewNoteEng] = useState("");
            const [newNoteKor, setNewNoteKor] = useState("");

            const [repetitionCount, setRepetitionCount] = useState(0);

            useEffect(() => {
                const initAuth = async () => {
                    await signInAnonymously(auth);
                };
                initAuth();
                
                const unsubscribe = onAuthStateChanged(auth, (u) => {
                    if (u) {
                        setUser(u);
                        setSyncId(u.uid); 
                    }
                });
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!user) return;
                
                const targetUserId = syncId || user.uid;
                const dayDocRef = doc(db, 'artifacts', appId, 'users', targetUserId, 'study_data', `day_${currentDay}`);

                const unsubscribe = onSnapshot(dayDocRef, (docSnap) => {
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        setSentences(data.sentences || getEmptySentences());
                        setRepetitionCount(data.repetitionCount || 0);
                    } else {
                        if (preloadedData[currentDay]) {
                            const initialData = preloadedData[currentDay];
                            setSentences(initialData);
                            setDoc(dayDocRef, { sentences: initialData, repetitionCount: 0 }, { merge: true });
                        } else {
                            setSentences(getEmptySentences());
                            setRepetitionCount(0);
                        }
                    }
                }, (error) => {
                    console.error("Error syncing day data:", error);
                });

                return () => unsubscribe();
            }, [user, currentDay, syncId]);

            useEffect(() => {
                if (!user) return;
                const targetUserId = syncId || user.uid;
                const globalDocRef = doc(db, 'artifacts', appId, 'users', targetUserId, 'study_data', 'global_data');

                const unsubscribe = onSnapshot(globalDocRef, (docSnap) => {
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        setNotes(data.notes || []);
                        setCompletedDates(data.completedDates || []);
                        if (data.timeLeft !== undefined) setTimeLeft(data.timeLeft);
                    }
                }, (error) => {
                    console.error("Error syncing global data:", error);
                });

                return () => unsubscribe();
            }, [user, syncId]);

            const saveDayData = async (newSentences, newRepCount) => {
                if (!user) return;
                const targetUserId = syncId || user.uid;
                const dayDocRef = doc(db, 'artifacts', appId, 'users', targetUserId, 'study_data', `day_${currentDay}`);
                await setDoc(dayDocRef, { sentences: newSentences, repetitionCount: newRepCount }, { merge: true });
            };

            const saveGlobalData = async (newNotes, newDates, newTime) => {
                if (!user) return;
                const targetUserId = syncId || user.uid;
                const globalDocRef = doc(db, 'artifacts', appId, 'users', targetUserId, 'study_data', 'global_data');
                await setDoc(globalDocRef, { 
                    notes: newNotes !== undefined ? newNotes : notes, 
                    completedDates: newDates !== undefined ? newDates : completedDates,
                    timeLeft: newTime !== undefined ? newTime : timeLeft
                }, { merge: true });
            };

            useEffect(() => {
                let interval = null;
                if (isActive && timeLeft > 0) {
                    interval = setInterval(() => {
                        setTimeLeft((prev) => {
                            const newTime = prev - 1;
                            if (newTime % 10 === 0) saveGlobalData(undefined, undefined, newTime);
                            if (newTime <= 0) {
                                setIsActive(false);
                                handleGoalAchieved();
                                return 0;
                            }
                            return newTime;
                        });
                    }, 1000);
                } else if (timeLeft === 0) {
                    setIsActive(false);
                }
                return () => clearInterval(interval);
            }, [isActive, timeLeft]); 

            const handleGoalAchieved = () => {
                const today = new Date().toISOString().split('T')[0];
                if (!completedDates.includes(today)) {
                    const newDates = [...completedDates, today];
                    setCompletedDates(newDates);
                    saveGlobalData(undefined, newDates, 0);
                    setShowCelebration(true);
                    setTimeout(() => setShowCelebration(false), 5000);
                }
            };

            const updateSentence = (index, field, value) => {
                const newSentences = [...sentences];
                newSentences[index] = { ...newSentences[index], [field]: value };
                setSentences(newSentences);
                saveDayData(newSentences, repetitionCount);
            };

            const toggleRepetition = (index) => {
                let newCount = index + 1;
                if (repetitionCount === newCount) {
                    newCount = index; 
                }
                setRepetitionCount(newCount);
                saveDayData(sentences, newCount);
            };

            const addNote = () => {
                if (newNoteEng.trim()) {
                    const newNoteList = [{ 
                        id: Date.now(), 
                        eng: newNoteEng, 
                        kor: newNoteKor,
                        date: new Date().toLocaleDateString() 
                    }, ...notes];
                    setNotes(newNoteList);
                    saveGlobalData(newNoteList, undefined, undefined);
                    setNewNoteEng("");
                    setNewNoteKor("");
                }
            };

            const deleteNote = (id) => {
                const newNoteList = notes.filter(n => n.id !== id);
                setNotes(newNoteList);
                saveGlobalData(newNoteList, undefined, undefined);
            };

            const changeDay = (direction) => {
                const newDay = direction === 'next' ? currentDay + 1 : currentDay - 1;
                if (newDay > 0) setCurrentDay(newDay);
            };

            const handleDaySubmit = () => {
                let d = parseInt(tempDay);
                if (isNaN(d) || d < 1) d = 1;
                setCurrentDay(d);
                setIsEditingDay(false);
            };

            const formatTime = (seconds) => {
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            };

            const toggleReveal = (index) => {
                if (!hideEnglish) return;
                setRevealedIndices(prev => prev.includes(index) ? prev.filter(i => i !== index) : [...prev, index]);
            };

            return (
                <div className="min-h-screen bg-[#F3F4F6] text-slate-800 font-sans p-4 md:p-8 selection:bg-[#B692F6] selection:text-white">
                    {/* Sync Modal */}
                    {showSyncModal && (
                        <div className="fixed inset-0 flex items-center justify-center z-50 bg-black/40 backdrop-blur-sm p-4">
                            <div className="bg-white p-6 rounded-3xl shadow-2xl max-w-md w-full animate-bounce-up">
                                <h3 className="text-xl font-bold mb-4 flex items-center gap-2 text-[#7C3AED]">
                                    <User size={24}/> 동기화 설정 (Sync)
                                </h3>
                                <p className="text-sm text-slate-600 mb-4 leading-relaxed">
                                    여러 기기에서 기록을 공유하려면, 아래 <strong>내 ID</strong>를 복사해서 다른 기기에 입력하세요.
                                </p>
                                
                                <div className="bg-slate-100 p-3 rounded-xl mb-4 flex items-center justify-between">
                                    <code className="text-xs md:text-sm font-mono text-slate-600 break-all">{user?.uid}</code>
                                    <button onClick={() => navigator.clipboard.writeText(user?.uid)} className="p-2 hover:bg-white rounded-lg transition-colors text-slate-500">
                                        <Copy size={16}/>
                                    </button>
                                </div>

                                <div className="border-t pt-4">
                                    <label className="text-xs font-bold text-slate-400 uppercase mb-2 block">다른 기기의 ID 입력하기</label>
                                    <input 
                                        type="text" 
                                        value={syncId} 
                                        onChange={(e) => setSyncId(e.target.value)}
                                        placeholder="여기에 ID를 붙여넣으세요"
                                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-[#7C3AED] outline-none"
                                    />
                                    <p className="text-xs text-slate-400 mt-2">* 입력 후 창을 닫으면 데이터가 로드됩니다.</p>
                                </div>

                                <button onClick={() => setShowSyncModal(false)} className="w-full mt-6 bg-[#7C3AED] text-white py-3 rounded-xl font-bold hover:bg-[#6D28D9] transition-colors">
                                    완료 (Done)
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Celebration Overlay */}
                    {showCelebration && (
                        <div className="fixed inset-0 flex items-center justify-center z-50 bg-black/20 backdrop-blur-sm animate-fade-in pointer-events-none">
                            <div className="bg-white p-8 rounded-3xl shadow-2xl text-center transform animate-bounce-up border-4 border-[#B692F6]">
                                <Trophy className="w-16 h-16 text-yellow-400 mx-auto mb-4" />
                                <h2 className="text-3xl font-bold mb-2 text-[#7C3AED]">Goal Achieved!</h2>
                                <p className="text-gray-600">오늘 1시간 공부 달성! 도장이 찍혔어요 쾅! 🎉</p>
                            </div>
                        </div>
                    )}

                    <div className="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-6">
                        
                        {/* Header */}
                        <div className="lg:col-span-12 flex flex-col md:flex-row justify-between items-center mb-4 gap-4">
                            <div className="flex items-center gap-4">
                                {/* Day Navigator */}
                                <div className="flex items-center bg-white rounded-2xl shadow-sm p-1 border border-slate-200">
                                    <button onClick={() => changeDay('prev')} className="p-2 hover:bg-slate-100 rounded-xl text-slate-400 hover:text-[#7C3AED] transition-colors">
                                        <ChevronLeft size={24} />
                                    </button>
                                    <div className="px-4 text-center min-w-[120px]">
                                        {isEditingDay ? (
                                            <input
                                                type="number"
                                                value={tempDay}
                                                onChange={(e) => setTempDay(e.target.value)}
                                                onBlur={handleDaySubmit}
                                                onKeyDown={(e) => e.key === 'Enter' && handleDaySubmit()}
                                                className="text-2xl font-extrabold text-[#7C3AED] w-20 text-center bg-transparent border-b-2 border-[#7C3AED] focus:outline-none"
                                                autoFocus
                                            />
                                        ) : (
                                            <h1 
                                                onClick={() => { setTempDay(currentDay); setIsEditingDay(true); }}
                                                className="text-2xl font-extrabold tracking-tight text-slate-900 flex items-center justify-center gap-2 cursor-pointer hover:bg-slate-100 px-2 rounded-lg transition-colors group"
                                            >
                                                <span className="text-[#7C3AED]">Day {currentDay}</span>
                                                <Edit2 size={14} className="text-slate-300 opacity-0 group-hover:opacity-100 transition-opacity"/>
                                            </h1>
                                        )}
                                    </div>
                                    <button onClick={() => changeDay('next')} className="p-2 hover:bg-slate-100 rounded-xl text-slate-400 hover:text-[#7C3AED] transition-colors">
                                        <ChevronRight size={24} />
                                    </button>
                                </div>
                            </div>

                            <div className="flex items-center gap-3 w-full md:w-auto justify-end">
                                {/* Sync Button */}
                                <button onClick={() => setShowSyncModal(true)} className="bg-white p-2 rounded-2xl shadow-sm border border-slate-200 hover:bg-slate-50 text-slate-500 hover:text-[#7C3AED] transition-colors" title="Sync across devices">
                                    <User size={20}/>
                                </button>
                                
                                {/* Date Badge */}
                                <div className="bg-white px-4 py-2 rounded-2xl shadow-sm border border-slate-200 flex items-center gap-2">
                                    <CalendarIcon className="w-4 h-4 text-slate-400"/>
                                    <span className="font-semibold text-slate-600">{new Date().toLocaleDateString()}</span>
                                </div>
                            </div>
                        </div>

                        {/* LEFT COLUMN */}
                        <div className="lg:col-span-4 space-y-6">
                            
                            {/* Timer */}
                            <div className="bg-white rounded-[2rem] p-6 shadow-xl shadow-slate-200/60 border border-slate-100 relative overflow-hidden">
                                <div className="absolute top-0 left-0 w-full h-2 bg-slate-100">
                                    <div 
                                        className="h-full bg-gradient-to-r from-[#C4B5FD] to-[#7C3AED] transition-all duration-1000 ease-linear"
                                        style={{ width: `${Math.min(((targetTime - timeLeft) / targetTime) * 100, 100)}%` }}
                                    />
                                </div>
                                <div className="flex justify-between items-center mb-8 mt-2">
                                    <h3 className="font-bold text-lg text-slate-700 flex items-center gap-2">
                                        <div className={`w-2 h-2 rounded-full ${isActive ? 'bg-red-400 animate-pulse' : 'bg-slate-300'}`}></div>
                                        Focus Timer
                                    </h3>
                                    <span className="text-xs font-bold text-[#7C3AED] bg-[#F3E8FF] px-3 py-1 rounded-full">Goal: 1hr</span>
                                </div>
                                <div className="text-center mb-8">
                                    <div className="text-7xl font-black text-slate-800 tracking-tighter tabular-nums">
                                        {formatTime(timeLeft)}
                                    </div>
                                    <p className="text-slate-400 text-sm mt-2 font-medium">{isActive ? "Keep burning! 🔥" : "Time to focus!"}</p>
                                </div>
                                <div className="flex justify-center gap-4">
                                    <button onClick={() => setIsActive(!isActive)} className={`w-16 h-16 rounded-full flex items-center justify-center text-white shadow-lg transition-transform active:scale-95 ${isActive ? 'bg-orange-400 hover:bg-orange-500' : 'bg-[#7C3AED] hover:bg-[#6D28D9]'}`}>
                                        {isActive ? <Pause fill="currentColor" /> : <Play fill="currentColor" className="ml-1" />}
                                    </button>
                                    <button onClick={() => { setIsActive(false); setTimeLeft(3600); }} className="w-16 h-16 rounded-full bg-slate-100 text-slate-500 flex items-center justify-center hover:bg-slate-200 transition-colors active:scale-95">
                                        <RotateCcw size={20} />
                                    </button>
                                </div>
                            </div>

                            {/* Stamps */}
                            <div className="bg-[#111827] text-white rounded-[2rem] p-6 shadow-xl relative overflow-hidden">
                                <div className="absolute top-[-20px] right-[-20px] w-32 h-32 bg-[#7C3AED] rounded-full blur-[60px] opacity-40"></div>
                                <h3 className="font-bold text-lg mb-4 flex items-center gap-2"><Trophy className="w-5 h-5 text-yellow-400" />Streak Log</h3>
                                <div className="grid grid-cols-7 gap-2">
                                    {[...Array(14)].map((_, i) => {
                                        const date = new Date();
                                        date.setDate(date.getDate() - (13 - i));
                                        const dateStr = date.toISOString().split('T')[0];
                                        const isCompleted = completedDates.includes(dateStr);
                                        const isToday = dateStr === new Date().toISOString().split('T')[0];
                                        return (
                                            <div key={i} className="flex flex-col items-center gap-1">
                                                <div className={`w-8 h-8 md:w-10 md:h-10 rounded-full flex items-center justify-center text-sm font-bold border-2 transition-all ${isCompleted ? 'bg-yellow-400 border-yellow-400 text-black' : isToday ? 'bg-transparent border-[#7C3AED] text-white' : 'bg-white/5 border-transparent text-white/30'}`}>
                                                    {isCompleted ? "★" : date.getDate()}
                                                </div>
                                                <span className="text-[10px] text-white/40">{date.toLocaleDateString('en-US', { weekday: 'narrow' })}</span>
                                            </div>
                                        )
                                    })}
                                </div>
                            </div>

                            {/* Inspo Notes */}
                            <div className="bg-[#FFF1F2] rounded-[2rem] p-6 shadow-md border-2 border-[#FFE4E6]">
                                <h3 className="font-bold text-[#BE123C] mb-4 flex items-center gap-2"><Sparkles className="w-5 h-5" />Inspo Notes</h3>
                                <div className="flex flex-col gap-2 mb-4">
                                    <input type="text" value={newNoteEng} onChange={(e) => setNewNoteEng(e.target.value)} placeholder="English Expression..." className="w-full bg-white/50 border-none rounded-xl px-4 py-2 text-sm focus:ring-2 focus:ring-[#BE123C] placeholder:text-[#BE123C]/40 outline-none text-[#BE123C]"/>
                                    <div className="flex gap-2">
                                        <input type="text" value={newNoteKor} onChange={(e) => setNewNoteKor(e.target.value)} placeholder="Meaning..." className="flex-1 bg-white/50 border-none rounded-xl px-4 py-2 text-sm focus:ring-2 focus:ring-[#BE123C] placeholder:text-[#BE123C]/40 outline-none text-[#BE123C]"/>
                                        <button onClick={addNote} className="bg-[#BE123C] text-white px-4 py-2 rounded-xl hover:bg-[#9F1239] transition-colors"><Plus size={20} /></button>
                                    </div>
                                </div>
                                <div className="space-y-2 max-h-[300px] overflow-y-auto pr-1 scrollbar-hide">
                                    {notes.length === 0 ? <p className="text-xs text-[#BE123C]/50 text-center py-4">No notes yet</p> : notes.map(note => (
                                        <div key={note.id} className="group bg-white p-3 rounded-xl shadow-sm border border-[#FECDD3] flex justify-between items-center">
                                            <div className="flex-1 min-w-0"><p className="text-sm font-bold text-slate-800 break-words">{note.eng}</p><p className="text-xs text-[#BE123C]/80 mt-1 break-words">{note.kor}</p></div>
                                            <button onClick={() => deleteNote(note.id)} className="text-[#FDA4AF] hover:text-[#BE123C] opacity-0 group-hover:opacity-100 transition-opacity ml-2 shrink-0"><Trash2 size={14} /></button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>

                        {/* RIGHT COLUMN */}
                        <div className="lg:col-span-8">
                            <div className="bg-white rounded-[2rem] p-6 md:p-8 shadow-xl shadow-slate-200/50 min-h-full">
                                
                                {/* Header + Mode Toggle */}
                                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
                                    <div>
                                        <h2 className="text-2xl font-bold text-slate-800 flex items-center gap-2"><BookOpen className="w-6 h-6 text-[#7C3AED]" />Today's 10 Sentences</h2>
                                        <p className="text-sm text-slate-500">{hideEnglish ? "Speaking Mode ON!" : `Day ${currentDay} Challenge`}</p>
                                    </div>
                                    <button onClick={() => setHideEnglish(!hideEnglish)} className={`flex items-center gap-2 px-5 py-3 rounded-full font-bold text-sm transition-all shadow-md active:scale-95 ${hideEnglish ? 'bg-[#7C3AED] text-white ring-4 ring-[#C4B5FD]' : 'bg-white text-slate-700 border border-slate-200 hover:bg-slate-50'}`}>
                                        {hideEnglish ? <EyeOff size={18}/> : <Eye size={18}/>}
                                        {hideEnglish ? "Mode ON" : "Study Mode"}
                                    </button>
                                </div>

                                {/* Repetition Tracker (Grape/Bubbles) */}
                                <div className="mb-8 p-6 bg-[#F5F3FF] rounded-2xl border border-[#DDD6FE]">
                                    <div className="flex justify-between items-center mb-4">
                                        <h3 className="font-bold text-[#5B21B6] flex items-center gap-2">
                                            <span>🍇</span>
                                            Repetition Check
                                        </h3>
                                        <span className="text-xs font-bold bg-white text-[#7C3AED] px-3 py-1 rounded-full shadow-sm">
                                            {repetitionCount} / 10 Sets
                                        </span>
                                    </div>
                                    <div className="flex justify-between items-center px-2">
                                        {[...Array(10)].map((_, i) => (
                                            <div 
                                                key={i}
                                                onClick={() => toggleRepetition(i)}
                                                className={`
                                                    w-7 h-7 md:w-10 md:h-10 rounded-full border-2 cursor-pointer transition-all duration-300 flex items-center justify-center transform hover:scale-110
                                                    ${i < repetitionCount 
                                                        ? 'bg-purple-50 border-[#7C3AED] shadow-md' 
                                                        : 'bg-white border-[#C4B5FD] border-dashed'
                                                    }
                                                `}
                                            >
                                                {i < repetitionCount ? <span className="text-lg md:text-2xl">🍇</span> : null}
                                            </div>
                                        ))}
                                    </div>
                                    <p className="text-center text-xs text-[#8B5CF6] mt-4 font-medium">
                                        10문장을 한 세트 다 말할 때마다 포도알을 하나씩 채워주세요! 🍇
                                    </p>
                                </div>

                                {/* Sentences List */}
                                <div className="space-y-6">
                                    {sentences.map((item, idx) => (
                                        <div key={idx} className={`group relative bg-white border rounded-2xl p-4 transition-all duration-300 ${hideEnglish ? 'border-[#7C3AED] shadow-lg shadow-purple-100 scale-[1.01]' : 'border-slate-100 hover:shadow-md hover:border-[#C4B5FD]'}`}>
                                            <div className={`absolute -left-3 -top-3 w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm shadow-lg transition-colors ${hideEnglish ? 'bg-[#7C3AED] text-white' : 'bg-slate-200 text-slate-500'}`}>{idx + 1}</div>
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 ml-2">
                                                <div className="relative flex flex-col">
                                                    <label className={`text-xs font-bold mb-1 block uppercase tracking-wider transition-colors ${hideEnglish ? 'text-[#7C3AED]' : 'text-slate-400'}`}>English</label>
                                                    <div onClick={() => toggleReveal(idx)} className={`relative flex-1 rounded-lg overflow-hidden transition-all duration-300 cursor-pointer ${hideEnglish && !revealedIndices.includes(idx) ? 'bg-slate-900' : 'bg-slate-50'}`}>
                                                        <textarea value={item.eng} onChange={(e) => updateSentence(idx, 'eng', e.target.value)} placeholder={`Day ${currentDay} 문장 (영어)`} className={`w-full h-full bg-transparent border-none rounded-lg text-slate-800 font-bold text-lg p-3 focus:ring-0 outline-none resize-none transition-all duration-300 ${hideEnglish && !revealedIndices.includes(idx) ? 'opacity-0 pointer-events-none' : 'opacity-100'}`} rows={3} disabled={hideEnglish && !revealedIndices.includes(idx)} />
                                                        {hideEnglish && !revealedIndices.includes(idx) && (<div className="absolute inset-0 flex items-center justify-center pointer-events-none"><span className="text-4xl animate-bounce">🙈</span></div>)}
                                                    </div>
                                                </div>
                                                <div className="flex flex-col">
                                                    <label className="text-xs font-bold text-slate-400 mb-1 block uppercase tracking-wider">Meaning</label>
                                                    <div className="bg-slate-50 rounded-lg p-3 flex-1">
                                                        <textarea value={item.kor} onChange={(e) => updateSentence(idx, 'kor', e.target.value)} placeholder="한국어 해석" className="w-full h-full bg-transparent border-none text-slate-700 text-base focus:ring-0 outline-none resize-none font-medium leading-relaxed" rows={3}/>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                                
                                <div className="mt-8 text-center text-xs text-slate-400">
                                    모든 내용은 온라인에 자동 저장됩니다. (동기화 ID를 사용하세요)
                                </div>

                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<StudyApp />);
    </script>
</body>
</html>
