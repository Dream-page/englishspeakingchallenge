            const [currentDay, setCurrentDay] = useState(() => {
                const savedDay = localStorage.getItem('lastVisitedDay');
                return savedDay ? parseInt(savedDay) : 46;
            });
            const [isEditingDay, setIsEditingDay] = useState(false);
            const [tempDay, setTempDay] = useState(currentDay); 
            
            const [sentences, setSentences] = useState(getEmptySentences());
            const [notes, setNotes] = useState([]);
            const [completedDates, setCompletedDates] = useState([]);
            
            const [activeTab, setActiveTab] = useState('challenge'); 

            const [viewDate, setViewDate] = useState(new Date());

            const [timeLeft, setTimeLeft] = useState(3600);
            const [isActive, setIsActive] = useState(false);
            const [targetTime] = useState(3600);
            const [showCelebration, setShowCelebration] = useState(false);

            const [hideEnglish, setHideEnglish] = useState(false);
            const [revealedIndices, setRevealedIndices] = useState([]);
            const [newNoteEng, setNewNoteEng] = useState("");
            const [newNoteKor, setNewNoteKor] = useState("");

            const [repetitionCount, setRepetitionCount] = useState(0);

            // --- Pagination States ---
            const [notesPage, setNotesPage] = useState(1);
            const NOTES_PER_PAGE = 10;

            useEffect(() => {
                const initAuth = async () => {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }
                };
                initAuth();
                
                const unsubscribe = onAuthStateChanged(auth, (u) => {
                    if (u) {
                        setUser(u);
                        // 저장된 syncId가 없으면 내 uid를 기본값으로 사용하지만, 저장하진 않음
                        if (!syncId) setSyncId(u.uid); 
                    }
                });
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                setRevealedIndices([]);
                // setHideEnglish(false); // [수정] 스터디 모드 유지 (주석 처리)
            }, [activeTab, currentDay, notesPage]); 

            useEffect(() => {
                if (!user) return;
                
                const targetUserId = syncId || user.uid;
                const dayDocRef = doc(db, 'artifacts', appId, 'users', targetUserId, 'study_data', `day_${currentDay}`);

                const unsubscribe = onSnapshot(dayDocRef, (docSnap) => {
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        setSentences(data.sentences || getEmptySentences());
                        setRepetitionCount(data.repetitionCount || 0);
                    } else {
                        if (preloadedData[currentDay]) {
                            const initialData = preloadedData[currentDay];
                            setSentences(initialData);
                            setDoc(dayDocRef, { sentences: initialData, repetitionCount: 0 }, { merge: true });
                        } else {
                            setSentences(getEmptySentences());
                            setRepetitionCount(0);
                        }
                    }
                }, (error) => {
                    console.error("Error syncing day data:", error);
                    // 💡 권한 오류 자동 복구 로직
                    if (error.code === 'permission-denied') {
                        if (syncId && user && syncId !== user.uid) {
                            alert("동기화 ID가 만료되었거나 권한이 없습니다. 자동으로 내 ID로 초기화합니다.");
                            setSyncId(user.uid);
                            localStorage.removeItem('savedSyncId');
                        } else {
                            console.warn("내 데이터에 접근할 수 없습니다. 배포된 앱이라면 Firestore 보안 규칙을 확인해주세요.");
                        }
                    }
                });

                return () => unsubscribe();
            }, [user, currentDay, syncId]);

            useEffect(() => {
                if (!user) return;
                const targetUserId = syncId || user.uid;
                const globalDocRef = doc(db, 'artifacts', appId, 'users', targetUserId, 'study_data', 'global_data');

                const unsubscribe = onSnapshot(globalDocRef, (docSnap) => {
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        setNotes(data.notes || []);
                        setCompletedDates(data.completedDates || []);
                        if (data.timeLeft !== undefined) setTimeLeft(data.timeLeft);
                    }
                }, (error) => {
                    console.error("Error syncing global data:", error);
                    // 💡 권한 오류 자동 복구 로직 (글로벌 데이터)
                    if (error.code === 'permission-denied' && syncId && user && syncId !== user.uid) {
                        // 위에서 이미 alert을 띄웠을 수 있으므로 여기선 조용히 처리
                        setSyncId(user.uid);
                        localStorage.removeItem('savedSyncId');
                    }
                });

                return () => unsubscribe();
            }, [user, syncId]);

            const saveDayData = async (newSentences, newRepCount) => {
                if (!user) return;
                const targetUserId = syncId || user.uid;
                const dayDocRef = doc(db, 'artifacts', appId, 'users', targetUserId, 'study_data', `day_${currentDay}`);
                await setDoc(dayDocRef, { sentences: newSentences, repetitionCount: newRepCount }, { merge: true });
            };

            const saveGlobalData = async (newNotes, newDates, newTime) => {
                if (!user) return;
                const targetUserId = syncId || user.uid;
                const globalDocRef = doc(db, 'artifacts', appId, 'users', targetUserId, 'study_data', 'global_data');
                await setDoc(globalDocRef, { 
                    notes: newNotes !== undefined ? newNotes : notes, 
                    completedDates: newDates !== undefined ? newDates : completedDates,
                    timeLeft: newTime !== undefined ? newTime : timeLeft
                }, { merge: true });
            };

            useEffect(() => {
                let interval = null;
                if (isActive && timeLeft > 0) {
                    interval = setInterval(() => {
                        setTimeLeft((prev) => {
                            const newTime = prev - 1;
                            if (newTime % 10 === 0) saveGlobalData(undefined, undefined, newTime);
                            if (newTime <= 0) {
                                setIsActive(false);
                                handleGoalAchieved();
                                return 0;
                            }
                            return newTime;
                        });
                    }, 1000);
                } else if (timeLeft === 0) {
                    setIsActive(false);
                }
                return () => clearInterval(interval);
            }, [isActive, timeLeft]); 

            const handleGoalAchieved = () => {
                const d = new Date();
                const today = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
                
                if (!completedDates.includes(today)) {
                    const newDates = [...completedDates, today];
                    setCompletedDates(newDates);
                    saveGlobalData(undefined, newDates, 0);
                    setShowCelebration(true);
                    setTimeout(() => setShowCelebration(false), 5000);
                }
            };

            const updateSentence = (index, field, value) => {
                const newSentences = [...sentences];
                newSentences[index] = { ...newSentences[index], [field]: value };
                setSentences(newSentences);
                saveDayData(newSentences, repetitionCount);
            };

            const toggleHighlight = (index, isNote = false, noteId = null) => {
                if (isNote) {
                    const newNotes = notes.map(n => 
                        n.id === noteId ? { ...n, highlight: !n.highlight } : n
                    );
                    setNotes(newNotes);
                    saveGlobalData(newNotes, undefined, undefined);
                } else {
                    const newSentences = [...sentences];
                    newSentences[index] = { 
                        ...newSentences[index], 
                        highlight: !newSentences[index].highlight 
                    };
                    setSentences(newSentences);
                    saveDayData(newSentences, repetitionCount);
                }
            };

            const toggleRepetition = (index) => {
                let newCount = index + 1;
                if (repetitionCount === newCount) {
                    newCount = index; 
                }
                setRepetitionCount(newCount);
                saveDayData(sentences, newCount);
            };

            // 🗣️ TTS (Text-to-Speech) Function
            const speakText = (text) => {
                if (!text) return;
                // 현재 재생 중인 오디오가 있다면 중지
                window.speechSynthesis.cancel();

                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US'; // 미국식 영어
                utterance.rate = 1.0; // 보통 속도 (0.5 ~ 2.0)
                window.speechSynthesis.speak(utterance);
            };

            const addNote = () => {
                if (newNoteEng.trim()) {
                    const newNoteList = [{ 
                        id: Date.now(), 
                        eng: newNoteEng, 
                        kor: newNoteKor,
                        date: new Date().toLocaleDateString(),
                        highlight: false
                    }, ...notes];
                    setNotes(newNoteList);
                    saveGlobalData(newNoteList, undefined, undefined);
                    setNewNoteEng("");
                    setNewNoteKor("");
                    setNotesPage(1); // 새 노트 추가 시 1페이지로 이동
                }
            };

            const deleteNote = (id) => {
                const newNoteList = notes.filter(n => n.id !== id);
                setNotes(newNoteList);
                saveGlobalData(newNoteList, undefined, undefined);
            };

            // --- Edit Handlers for Inspo Notes ---
            const startEditing = (note) => {
                setEditingNoteId(note.id);
                setEditEng(note.eng);
                setEditKor(note.kor);
            };

            const cancelEdit = () => {
                setEditingNoteId(null);
                setEditEng("");
                setEditKor("");
            };

            const saveEdit = () => {
                const updatedNotes = notes.map(n => 
                    n.id === editingNoteId ? { ...n, eng: editEng, kor: editKor } : n
                );
                setNotes(updatedNotes);
                saveGlobalData(updatedNotes, undefined, undefined);
                setEditingNoteId(null);
            };

            const changeDay = (direction) => {
                const newDay = direction === 'next' ? currentDay + 1 : currentDay - 1;
                if (newDay > 0) {
                    setCurrentDay(newDay);
                    localStorage.setItem('lastVisitedDay', newDay); 
                }
            };

            const handleDaySubmit = () => {
                let d = parseInt(tempDay);
                if (isNaN(d) || d < 1) d = 1;
                setCurrentDay(d);
                localStorage.setItem('lastVisitedDay', d); 
                setIsEditingDay(false);
            };

            const handleSyncSave = () => {
                if (syncId) {
                    localStorage.setItem('savedSyncId', syncId); 
                }
                setShowSyncModal(false);
            };

            const formatTime = (seconds) => {
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            };

            const toggleReveal = (index) => {
                if (!hideEnglish) return;
                setRevealedIndices(prev => prev.includes(index) ? prev.filter(i => i !== index) : [...prev, index]);
            };

            const getDaysInMonth = (year, month) => new Date(year, month + 1, 0).getDate();
            const getFirstDayOfMonth = (year, month) => new Date(year, month, 1).getDay();

            const changeMonth = (offset) => {
                const newDate = new Date(viewDate);
                newDate.setMonth(newDate.getMonth() + offset);
                setViewDate(newDate);
            };

            // --- Pagination Logic ---
            const indexOfLastNote = notesPage * NOTES_PER_PAGE;
            const indexOfFirstNote = indexOfLastNote - NOTES_PER_PAGE;
            const currentNotes = notes.slice(indexOfFirstNote, indexOfLastNote);
            const totalPages = Math.ceil(notes.length / NOTES_PER_PAGE);

            const paginate = (pageNumber) => setNotesPage(pageNumber);

            return (
                <div className="min-h-screen bg-[#F3F4F6] text-slate-800 font-sans p-4 md:p-8 selection:bg-[#B692F6] selection:text-white">
                    {/* Sync Modal */}
                    {showSyncModal && (
                        <div className="fixed inset-0 flex items-center justify-center z-50 bg-black/40 backdrop-blur-sm p-4">
                            <div className="bg-white p-6 rounded-3xl shadow-2xl max-w-md w-full animate-bounce-up">
                                <h3 className="text-xl font-bold mb-4 flex items-center gap-2 text-[#7C3AED]">
                                    <User size={24}/> 동기화 설정 (Sync)
                                </h3>
                                <p className="text-sm text-slate-600 mb-4 leading-relaxed">
                                    여러 기기에서 기록을 공유하려면, 아래 <strong>내 ID</strong>를 복사해서 다른 기기에 입력하세요.
                                </p>
                                
                                <div className="bg-slate-100 p-3 rounded-xl mb-4 flex items-center justify-between">
                                    <code className="text-xs md:text-sm font-mono text-slate-600 break-all">{user?.uid}</code>
                                    <button onClick={() => navigator.clipboard.writeText(user?.uid)} className="p-2 hover:bg-white rounded-lg transition-colors text-slate-500">
                                        <Copy size={16}/>
                                    </button>
                                </div>

                                <div className="border-t pt-4">
                                    <label className="text-xs font-bold text-slate-400 uppercase mb-2 block">다른 기기의 ID 입력하기</label>
                                    <input 
                                        type="text" 
                                        value={syncId} 
                                        onChange={(e) => setSyncId(e.target.value)}
                                        placeholder="여기에 ID를 붙여넣으세요"
                                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-[#7C3AED] outline-none"
                                    />
                                    <p className="text-xs text-slate-400 mt-2">* 입력 후 '완료'를 누르면 기기에 저장됩니다.</p>
                                </div>

                                <button onClick={handleSyncSave} className="w-full mt-6 bg-[#7C3AED] text-white py-3 rounded-xl font-bold hover:bg-[#6D28D9] transition-colors">
                                    완료 (Done)
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Celebration Overlay */}
                    {showCelebration && (
                        <div className="fixed inset-0 flex items-center justify-center z-50 bg-black/20 backdrop-blur-sm animate-fade-in pointer-events-none">
                            <div className="bg-white p-8 rounded-3xl shadow-2xl text-center transform animate-bounce-up border-4 border-[#B692F6]">
                                <Trophy className="w-16 h-16 text-yellow-400 mx-auto mb-4" />
                                <h2 className="text-3xl font-bold mb-2 text-[#7C3AED]">Goal Achieved!</h2>
                                <p className="text-gray-600">오늘 1시간 공부 달성! 도장이 찍혔어요 쾅! 🎉</p>
                            </div>
                        </div>
                    )}

                    <div className="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-6">
                        
                        {/* Header */}
                        <div className="lg:col-span-12 flex flex-col md:flex-row justify-between items-center mb-4 gap-4">
                            <div className="flex items-center gap-4">
                                {/* Day Navigator */}
                                <div className="flex items-center bg-white rounded-2xl shadow-sm p-1 border border-slate-200">
                                    <button onClick={() => changeDay('prev')} className="p-2 hover:bg-slate-100 rounded-xl text-slate-400 hover:text-[#7C3AED] transition-colors">
                                        <ChevronLeft size={24} />
                                    </button>
                                    <div className="px-4 text-center min-w-[120px]">
                                        {isEditingDay ? (
                                            <input
                                                type="number"
                                                value={tempDay}
                                                onChange={(e) => setTempDay(e.target.value)}
                                                onBlur={handleDaySubmit}
                                                onKeyDown={(e) => e.key === 'Enter' && handleDaySubmit()}
                                                className="text-2xl font-extrabold text-[#7C3AED] w-20 text-center bg-transparent border-b-2 border-[#7C3AED] focus:outline-none"
                                                autoFocus
                                            />
                                        ) : (
                                            <h1 
                                                onClick={() => { setTempDay(currentDay); setIsEditingDay(true); }}
                                                className="text-2xl font-extrabold tracking-tight text-slate-900 flex items-center justify-center gap-2 cursor-pointer hover:bg-slate-100 px-2 rounded-lg transition-colors group"
                                            >
                                                <span className="text-[#7C3AED]">Day {currentDay}</span>
                                                <Edit2 size={14} className="text-slate-300 opacity-0 group-hover:opacity-100 transition-opacity"/>
                                            </h1>
                                        )}
                                    </div>
                                    <button onClick={() => changeDay('next')} className="p-2 hover:bg-slate-100 rounded-xl text-slate-400 hover:text-[#7C3AED] transition-colors">
                                        <ChevronRight size={24} />
                                    </button>
                                </div>
                            </div>

                            <div className="flex items-center gap-3 w-full md:w-auto justify-end">
                                {/* Sync Button */}
                                <button onClick={() => setShowSyncModal(true)} className="bg-white p-2 rounded-2xl shadow-sm border border-slate-200 hover:bg-slate-50 text-slate-500 hover:text-[#7C3AED] transition-colors" title="Sync across devices">
                                    <User size={20}/>
                                </button>
                                
                                {/* Date Badge */}
                                <div className="bg-white px-4 py-2 rounded-2xl shadow-sm border border-slate-200 flex items-center gap-2">
                                    <CalendarIcon className="w-4 h-4 text-slate-400"/>
                                    <span className="font-semibold text-slate-600">{new Date().toLocaleDateString()}</span>
                                </div>
                            </div>
                        </div>

                        {/* LEFT COLUMN */}
                        <div className="lg:col-span-4 space-y-6">
                            
                            {/* Timer */}
                            <div className="bg-white rounded-[2rem] p-6 shadow-xl shadow-slate-200/60 border border-slate-100 relative overflow-hidden">
                                <div className="absolute top-0 left-0 w-full h-2 bg-slate-100">
                                    <div 
                                        className="h-full bg-gradient-to-r from-[#C4B5FD] to-[#7C3AED] transition-all duration-1000 ease-linear"
                                        style={{ width: `${Math.min(((targetTime - timeLeft) / targetTime) * 100, 100)}%` }}
                                    />
                                </div>
                                <div className="flex justify-between items-center mb-8 mt-2">
                                    <h3 className="font-bold text-lg text-slate-700 flex items-center gap-2">
                                        <div className={`w-2 h-2 rounded-full ${isActive ? 'bg-red-400 animate-pulse' : 'bg-slate-300'}`}></div>
                                        Focus Timer
                                    </h3>
                                    <span className="text-xs font-bold text-[#7C3AED] bg-[#F3E8FF] px-3 py-1 rounded-full">Goal: 1hr</span>
                                </div>
                                <div className="text-center mb-8">
                                    <div className="text-7xl font-black text-slate-800 tracking-tighter tabular-nums">
                                        {formatTime(timeLeft)}
                                    </div>
                                    <p className="text-slate-400 text-sm mt-2 font-medium">{isActive ? "Keep burning! 🔥" : "Time to focus!"}</p>
                                </div>
                                <div className="flex justify-center gap-4">
                                    <button onClick={() => setIsActive(!isActive)} className={`w-16 h-16 rounded-full flex items-center justify-center text-white shadow-lg transition-transform active:scale-95 ${isActive ? 'bg-orange-400 hover:bg-orange-500' : 'bg-[#7C3AED] hover:bg-[#6D28D9]'}`}>
                                        {isActive ? <Pause fill="currentColor" /> : <Play fill="currentColor" className="ml-1" />}
                                    </button>
                                    <button onClick={() => { setIsActive(false); setTimeLeft(3600); }} className="w-16 h-16 rounded-full bg-slate-100 text-slate-500 flex items-center justify-center hover:bg-slate-200 transition-colors active:scale-95">
                                        <RotateCcw size={20} />
                                    </button>
                                </div>
                            </div>

                            {/* Monthly Streak Calendar */}
                            <div className="bg-[#111827] text-white rounded-[2rem] p-6 shadow-xl relative overflow-hidden">
                                <div className="absolute top-[-20px] right-[-20px] w-32 h-32 bg-[#7C3AED] rounded-full blur-[60px] opacity-40 pointer-events-none"></div>
                                <h3 className="font-bold text-lg mb-4 flex items-center gap-2"><Trophy className="w-5 h-5 text-yellow-400" />Streak Log</h3>
                                
                                {/* Calendar Header */}
                                <div className="flex justify-between items-center mb-4 px-2 relative z-10">
                                    <button onClick={() => changeMonth(-1)} className="text-white/50 hover:text-white transition-colors p-1">
                                        <ChevronLeft size={20} />
                                    </button>
                                    <h3 className="font-bold text-lg text-white flex items-center gap-2">
                                        <span className="text-yellow-400 drop-shadow-md">{viewDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' })}</span>
                                    </h3>
                                    <button onClick={() => changeMonth(1)} className="text-white/50 hover:text-white transition-colors p-1">
                                        <ChevronRight size={20} />
                                    </button>
                                </div>

                                {/* Calendar Grid */}
                                <div className="grid grid-cols-7 gap-y-3 gap-x-1 text-center">
                                    {['S', 'M', 'T', 'W', 'T', 'F', 'S'].map(d => (
                                        <div key={d} className="text-[10px] font-bold text-[#7C3AED] uppercase mb-1">{d}</div>
                                    ))}
                                    {/* Empty Slots */}
                                    {Array.from({ length: getFirstDayOfMonth(viewDate.getFullYear(), viewDate.getMonth()) }).map((_, i) => (
                                        <div key={`empty-${i}`} />
                                    ))}
                                    {/* Days */}
                                    {Array.from({ length: getDaysInMonth(viewDate.getFullYear(), viewDate.getMonth()) }).map((_, i) => {
                                        const day = i + 1;
                                        const dateStr = `${viewDate.getFullYear()}-${String(viewDate.getMonth() + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                                        const isCompleted = completedDates.includes(dateStr);
                                        const today = new Date();
                                        const todayStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
                                        const isToday = dateStr === todayStr;
                                        
                                        return (
                                            <div key={day} className="flex flex-col items-center">
                                                <div className={`w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold border transition-all cursor-default
                                                    ${isCompleted 
                                                        ? 'bg-yellow-400 border-yellow-400 text-black shadow-lg shadow-yellow-400/20 scale-110' 
                                                        : isToday 
                                                            ? 'bg-white/10 border-[#7C3AED] text-white ring-2 ring-[#7C3AED]/50' 
                                                            : 'bg-transparent border-transparent text-white/40 hover:bg-white/5'
                                                    }
                                                `}>
                                                    {isCompleted ? "★" : day}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>

                        {/* RIGHT COLUMN (MAIN CONTENT) */}
                        <div className="lg:col-span-8">
                            <div className="bg-white rounded-[2rem] p-6 md:p-8 shadow-xl shadow-slate-200/50 min-h-full">
                                
                                {/* TABS & Header */}
                                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
                                    <div className="flex items-center gap-2 bg-slate-100 p-1 rounded-xl">
                                        <button 
                                            onClick={() => setActiveTab('challenge')}
                                            className={`flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-bold transition-all ${activeTab === 'challenge' ? 'bg-white text-[#7C3AED] shadow-sm' : 'text-slate-400 hover:text-slate-600'}`}
                                        >
                                            <BookOpen size={16} /> Day {currentDay} Challenge
                                        </button>
                                        <button 
                                            onClick={() => setActiveTab('notes')}
                                            className={`flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-bold transition-all ${activeTab === 'notes' ? 'bg-white text-[#BE123C] shadow-sm' : 'text-slate-400 hover:text-slate-600'}`}
                                        >
                                            <Sparkles size={16} /> Inspo Notes
                                        </button>
                                    </div>

                                    <button onClick={() => setHideEnglish(!hideEnglish)} className={`flex items-center gap-2 px-5 py-3 rounded-full font-bold text-sm transition-all shadow-md active:scale-95 ${hideEnglish ? 'bg-slate-800 text-white ring-4 ring-slate-200' : 'bg-white text-slate-700 border border-slate-200 hover:bg-slate-50'}`}>
                                        {hideEnglish ? <EyeOff size={18}/> : <Eye size={18}/>}
                                        {hideEnglish ? "Mode ON" : "Study Mode"}
                                    </button>
                                </div>

                                {/* CONTENT SWITCH */}
                                {activeTab === 'challenge' ? (
                                    <>
                                        {/* Repetition Tracker (Grape/Bubbles) */}
                                        <div className="mb-8 p-6 bg-[#F5F3FF] rounded-2xl border border-[#DDD6FE]">
                                            <div className="flex justify-between items-center mb-4">
                                                <h3 className="font-bold text-[#5B21B6] flex items-center gap-2">
                                                    <span>🍇</span>
                                                    Repetition Check
                                                </h3>
                                                <span className="text-xs font-bold bg-white text-[#7C3AED] px-3 py-1 rounded-full shadow-sm">
                                                    {repetitionCount} / 10 Sets
                                                </span>
                                            </div>
                                            <div className="flex justify-between items-center px-2">
                                                {[...Array(10)].map((_, i) => (
                                                    <div 
                                                        key={i}
                                                        onClick={() => toggleRepetition(i)}
                                                        className={`
                                                            w-7 h-7 md:w-10 md:h-10 rounded-full border-2 cursor-pointer transition-all duration-300 flex items-center justify-center transform hover:scale-110
                                                            ${i < repetitionCount 
                                                                ? 'bg-purple-50 border-[#7C3AED] shadow-md' 
                                                                : 'bg-white border-[#C4B5FD] border-dashed'
                                                            }
                                                        `}
                                                    >
                                                        {i < repetitionCount ? <span className="text-lg md:text-2xl">🍇</span> : null}
                                                    </div>
                                                ))}
                                            </div>
                                            
                                            {/* Topic Display Section */}
                                            <div className="mt-6 text-center">
                                                <div className="inline-block bg-white px-4 py-1 rounded-full border border-purple-100 shadow-sm mb-2">
                                                    <span className="text-xs font-bold text-purple-400 uppercase tracking-wider">Today's Topic</span>
                                                </div>
                                                <h3 className="text-lg md:text-xl font-bold text-slate-700 break-keep">
                                                    {dayTopics[currentDay] || "자유 주제 (Free Talk)"}
                                                </h3>
                                            </div>
                                        </div>

                                        {/* Sentences List */}
                                        <div className="space-y-6">
                                            {sentences.map((item, idx) => (
                                                <div key={idx} className={`group relative bg-white border rounded-2xl p-4 transition-all duration-300 ${hideEnglish ? 'border-[#7C3AED] shadow-lg shadow-purple-100 scale-[1.01]' : 'border-slate-100 hover:shadow-md hover:border-[#C4B5FD]'}`}>
                                                    <div className={`absolute -left-3 -top-3 w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm shadow-lg transition-colors ${hideEnglish ? 'bg-[#7C3AED] text-white' : 'bg-slate-200 text-slate-500'}`}>{idx + 1}</div>
                                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 ml-2">
                                                        <div className="relative flex flex-col">
                                                            <div className="flex justify-between items-end mb-1">
                                                                <label className={`text-xs font-bold block uppercase tracking-wider transition-colors ${hideEnglish ? 'text-[#7C3AED]' : 'text-slate-400'}`}>English</label>
                                                                <div className="flex items-center gap-2">
                                                                    <button 
                                                                        onClick={() => speakText(item.eng)}
                                                                        className="p-1 rounded-full hover:bg-slate-100 text-slate-400 hover:text-[#7C3AED] transition-colors"
                                                                        title="듣기 (Listen)"
                                                                    >
                                                                        <Volume2 size={16} />
                                                                    </button>
                                                                    <button 
                                                                        onClick={() => toggleHighlight(idx)}
                                                                        className={`p-1 rounded-full hover:bg-slate-100 transition-colors ${item.highlight ? 'text-yellow-500 bg-yellow-50' : 'text-slate-300'}`}
                                                                        title="어려운 문장 하이라이트"
                                                                    >
                                                                        <Highlighter size={14} />
                                                                    </button>
                                                                </div>
                                                            </div>
                                                            
                                                            <div 
                                                                onClick={() => toggleReveal(idx)} 
                                                                className={`relative flex-1 rounded-lg overflow-hidden transition-all duration-300 cursor-pointer 
                                                                    ${hideEnglish && !revealedIndices.includes(idx) ? 'bg-slate-900' : (item.highlight ? 'bg-yellow-50' : 'bg-slate-50')}
                                                                `}
                                                            >
                                                                <textarea 
                                                                    value={item.eng} 
                                                                    onChange={(e) => updateSentence(idx, 'eng', e.target.value)} 
                                                                    placeholder={`Day ${currentDay} 문장 (영어)`} 
                                                                    className={`w-full h-full bg-transparent border-none rounded-lg text-slate-800 font-bold text-lg p-3 focus:ring-0 outline-none resize-none transition-all duration-300 
                                                                        ${hideEnglish && !revealedIndices.includes(idx) ? 'opacity-0 pointer-events-none' : 'opacity-100'}
                                                                    `} 
                                                                    rows={3} 
                                                                    disabled={hideEnglish && !revealedIndices.includes(idx)} 
                                                                />
                                                                {hideEnglish && !revealedIndices.includes(idx) && (
                                                                    <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
                                                                        <span className="text-4xl">🙈</span>
                                                                    </div>
                                                                )}
                                                            </div>
                                                        </div>
                                                        <div className="flex flex-col">
                                                            <label className="text-xs font-bold text-slate-400 mb-1 block uppercase tracking-wider">Meaning</label>
                                                            <div className="bg-slate-50 rounded-lg p-3 flex-1">
                                                                <textarea value={item.kor} onChange={(e) => updateSentence(idx, 'kor', e.target.value)} placeholder="한국어 해석" className="w-full h-full bg-transparent border-none text-slate-700 text-base focus:ring-0 outline-none resize-none font-medium leading-relaxed" rows={3}/>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </>
                                ) : (
                                    <>
                                        {/* Inspo Notes Input Area */}
                                        <div className="mb-8 p-6 bg-[#FFF1F2] rounded-2xl border border-[#FFE4E6]">
                                            <div className="flex justify-between items-center mb-4">
                                                <h3 className="font-bold text-[#BE123C] flex items-center gap-2">
                                                    <StickyNote className="w-5 h-5"/>
                                                    Add New Note
                                                </h3>
                                            </div>
                                            <div className="flex flex-col gap-3">
                                                <input 
                                                    type="text" 
                                                    value={newNoteEng} 
                                                    onChange={(e) => setNewNoteEng(e.target.value)} 
                                                    placeholder="English Expression (ex: That hits the spot!)" 
                                                    className="w-full bg-white border-none rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-[#BE123C] placeholder:text-[#BE123C]/40 outline-none text-slate-800 font-medium"
                                                />
                                                <div className="flex gap-2">
                                                    <input 
                                                        type="text" 
                                                        value={newNoteKor} 
                                                        onChange={(e) => setNewNoteKor(e.target.value)} 
                                                        placeholder="Meaning / Context (ex: 딱 내가 원하던 거야!)" 
                                                        className="flex-1 bg-white border-none rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-[#BE123C] placeholder:text-[#BE123C]/40 outline-none text-slate-800"
                                                    />
                                                    <button 
                                                        onClick={addNote} 
                                                        className="bg-[#BE123C] text-white px-6 py-3 rounded-xl hover:bg-[#9F1239] transition-colors font-bold flex items-center gap-2"
                                                    >
                                                        <Plus size={20} /> Add
                                                    </button>
                                                </div>
                                            </div>
                                        </div>

                                        {/* Inspo Notes List (Card Style) */}
                                        <div className="space-y-6">
                                            {notes.length === 0 ? (
                                                <div className="text-center py-12 text-slate-400">
                                                    <Sparkles className="w-12 h-12 mx-auto mb-4 opacity-20" />
                                                    <p>아직 기록된 표현이 없어요.</p>
                                                    <p className="text-sm mt-1">릴스나 미드에서 본 멋진 표현을 추가해보세요!</p>
                                                </div>
                                            ) : (
                                                <>
                                                    {currentNotes.map((note, idx) => (
                                                        <div key={note.id} className={`group relative bg-white border rounded-2xl p-4 transition-all duration-300 ${hideEnglish ? 'border-[#BE123C] shadow-lg shadow-pink-100 scale-[1.01]' : 'border-slate-100 hover:shadow-md hover:border-[#FECDD3]'}`}>
                                                            <div className="flex justify-between items-start mb-2">
                                                                <span className="text-[10px] font-bold text-[#BE123C] bg-[#FFF1F2] px-2 py-1 rounded-md">
                                                                    {note.date}
                                                                </span>
                                                                <div className="flex items-center gap-2">
                                                                    {/* ✏️ 수정된 부분: Edit Mode UI */}
                                                                    {editingNoteId === note.id ? (
                                                                        <div className="flex gap-2">
                                                                            <button onClick={saveEdit} className="text-green-500 hover:text-green-600 transition-colors" title="저장">
                                                                                <Check size={18}/>
                                                                            </button>
                                                                            <button onClick={cancelEdit} className="text-red-400 hover:text-red-500 transition-colors" title="취소">
                                                                                <X size={18}/>
                                                                            </button>
                                                                        </div>
                                                                    ) : (
                                                                        <div className="flex items-center gap-2">
                                                                            <button 
                                                                                onClick={() => speakText(note.eng)}
                                                                                className="p-1 rounded-full hover:bg-slate-100 text-slate-400 hover:text-[#BE123C] transition-colors"
                                                                                title="듣기"
                                                                            >
                                                                                <Volume2 size={16} />
                                                                            </button>
                                                                            <button 
                                                                                onClick={() => startEditing(note)}
                                                                                className="p-1 rounded-full hover:bg-slate-100 text-slate-400 hover:text-[#BE123C] transition-colors"
                                                                                title="수정"
                                                                            >
                                                                                <Edit2 size={16} />
                                                                            </button>
                                                                            <button 
                                                                                onClick={() => toggleHighlight(null, true, note.id)}
                                                                                className={`p-1 rounded-full hover:bg-slate-100 transition-colors ${note.highlight ? 'text-yellow-500 bg-yellow-50' : 'text-slate-300'}`}
                                                                                title="강조"
                                                                            >
                                                                                <Highlighter size={16} />
                                                                            </button>
                                                                            <button onClick={() => deleteNote(note.id)} className="text-slate-300 hover:text-red-400 transition-colors" title="삭제">
                                                                                <Trash2 size={16} />
                                                                            </button>
                                                                        </div>
                                                                    )}
                                                                </div>
                                                            </div>

                                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 ml-1">
                                                                {/* English Part */}
                                                                {editingNoteId === note.id ? (
                                                                     <div className="bg-slate-50 border border-purple-200 rounded-lg p-3 min-h-[80px] flex items-center">
                                                                        <textarea 
                                                                            value={editEng} 
                                                                            onChange={(e) => setEditEng(e.target.value)} 
                                                                            className="w-full h-full bg-transparent border-none text-slate-800 font-bold text-lg focus:ring-0 outline-none resize-none"
                                                                            rows={2}
                                                                        />
                                                                     </div>
                                                                ) : (
                                                                    <div 
                                                                        onClick={() => toggleReveal(idx + 1000)} // Offset index to avoid conflict
                                                                        className={`relative rounded-lg overflow-hidden transition-all duration-300 cursor-pointer min-h-[80px] flex items-center p-3
                                                                            ${hideEnglish && !revealedIndices.includes(idx + 1000) ? 'bg-slate-900' : (note.highlight ? 'bg-yellow-50' : 'bg-slate-50')}
                                                                        `}
                                                                    >
                                                                        <p className={`text-lg font-bold text-slate-800 w-full break-words ${hideEnglish && !revealedIndices.includes(idx + 1000) ? 'opacity-0' : 'opacity-100'}`}>
                                                                            {note.eng}
                                                                        </p>
                                                                        {hideEnglish && !revealedIndices.includes(idx + 1000) && (
                                                                            <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
                                                                                <span className="text-4xl">🙈</span>
                                                                            </div>
                                                                        )}
                                                                    </div>
                                                                )}

                                                                {/* Korean Part */}
                                                                {editingNoteId === note.id ? (
                                                                    <div className="bg-slate-50 border border-purple-200 rounded-lg p-3 min-h-[80px] flex items-center">
                                                                        <textarea 
                                                                            value={editKor} 
                                                                            onChange={(e) => setEditKor(e.target.value)} 
                                                                            className="w-full h-full bg-transparent border-none text-slate-700 text-base focus:ring-0 outline-none resize-none"
                                                                            rows={2}
                                                                        />
                                                                    </div>
                                                                ) : (
                                                                    <div className="bg-slate-50 rounded-lg p-3 min-h-[80px] flex items-center">
                                                                        <p className="text-base text-slate-700 w-full break-words font-medium">
                                                                            {note.kor}
                                                                        </p>
                                                                    </div>
                                                                )}
                                                            </div>
                                                        </div>
                                                    ))}
                                                    
                                                    {/* Pagination Controls */}
                                                    {notes.length > NOTES_PER_PAGE && (
                                                        <div className="flex justify-center items-center gap-4 mt-8">
                                                            <button 
                                                                onClick={() => paginate(Math.max(1, notesPage - 1))}
                                                                disabled={notesPage === 1}
                                                                className={`flex items-center gap-1 px-4 py-2 rounded-lg text-sm font-bold transition-colors ${notesPage === 1 ? 'text-slate-300 cursor-not-allowed' : 'text-[#BE123C] hover:bg-[#FFF1F2]'}`}
                                                            >
                                                                <ChevronLeft size={16} /> 이전
                                                            </button>
                                                            <span className="text-sm font-bold text-slate-600">
                                                                {notesPage} / {totalPages}
                                                            </span>
                                                            <button 
                                                                onClick={() => paginate(Math.min(totalPages, notesPage + 1))}
                                                                disabled={notesPage === totalPages}
                                                                className={`flex items-center gap-1 px-4 py-2 rounded-lg text-sm font-bold transition-colors ${notesPage === totalPages ? 'text-slate-300 cursor-not-allowed' : 'text-[#BE123C] hover:bg-[#FFF1F2]'}`}
                                                            >
                                                                다음 <ChevronRight size={16} />
                                                            </button>
                                                        </div>
                                                    )}
                                                </>
                                            )}
                                        </div>
                                    </>
                                )}
                                
                                <div className="mt-8 text-center text-xs text-slate-400">
                                    모든 내용은 온라인에 자동 저장됩니다. (동기화 ID를 사용하세요)
                                </div>

                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<StudyApp />);
    </script>
</body>
</html>
